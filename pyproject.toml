[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "impulator"
version = "2.2.0-dev"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.42.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.1.0",
    "orjson>=3.9",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9.9",
    "httpx>=0.25.0",
    "requests>=2.31.0",
    "streamlit>=1.52.0",
    "plotly>=6.2.0",
    "kaleido>=1.1.0",
    "azure-storage-blob>=12.19.0",
    "rdkit>=2024.9.0",
    # Scientific deps — pinned <3.0.0 until migration evaluated
    # TODO: evaluate pandas 3.0 and numpy 3.0 migration in future milestone
    "pandas>=2.0.0,<3.0.0",
    "chembl-webresource-client>=0.10.9",
    "numpy>=2.4.3,<3.0.0",
    "scipy>=1.11.0",
    "statsmodels>=0.14.0",
    # Floor is 1.6.0 because umap-learn>=0.5.12 requires scikit-learn>=1.6.
    "scikit-learn>=1.6.0,<2.0.0",
    # Stage-3 Chemical Space UMAP toggle (Phase 24, D-S3-DEP); PCA remains the no-dep default.
    # Pulls a heavy LLVM JIT transitive set: numba, llvmlite, pynndescent, tqdm.
    "umap-learn>=0.5.12",
    "structlog>=25.0.0",
    "tenacity>=9.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23",
    "testcontainers[postgres]>=4.14",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
include = ["backend*", "frontend*"]

[tool.setuptools.package-data]
backend = ["py.typed"]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".agent",
    ".claude",
    ".git",
    ".github",
    ".pytest_cache",
    ".ruff_cache",
    "__pycache__",
    "build",
    "dist",
    "venv",
    ".venv",
    "env",
    ".env",
    "node_modules",
]

# Same as Black.
line-length = 88
indent-width = 4

[tool.coverage.run]
source = ["backend"]
omit = ["backend/scripts/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__",
    "if TYPE_CHECKING",
]

[tool.ruff.lint]
# Enable Pyflakes (`F`) and pycodestyle (`E`, `W`) codes by default.
select = ["E4", "E7", "E9", "F", "UP006", "UP007", "UP035"]
ignore = []

# Allow fix for all enabled rules (when `--fix` is provided).
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
# Alembic auto-generates old-style typing; don't enforce modern syntax there
"backend/alembic/versions/*.py" = ["UP006", "UP007", "UP035"]
