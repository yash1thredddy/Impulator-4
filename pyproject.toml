[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "impulator"
version = "2.1.3"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.0",
    "httpx>=0.25.0",
    "requests>=2.31.0",
    "streamlit>=1.52.0",
    "plotly>=6.2.0",
    "kaleido>=1.1.0",
    "azure-storage-blob>=12.19.0",
    "rdkit>=2024.9.0",
    "pandas>=2.0.0",
    "chembl-webresource-client>=0.10.9",
    "numpy>=2.0.0",
    "scipy>=1.11.0",
    "statsmodels>=0.14.0",
    "structlog>=25.0.0",
    "tenacity>=9.0.0",
    "python-dotenv>=1.0.0",
]

[tool.setuptools.packages.find]
include = ["backend*", "frontend*"]

[tool.setuptools.package-data]
backend = ["py.typed"]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".agent",
    ".claude",
    ".git",
    ".github",
    ".pytest_cache",
    ".ruff_cache",
    "__pycache__",
    "build",
    "dist",
    "venv",
    ".venv",
    "env",
    ".env",
    "node_modules",
]

# Same as Black.
line-length = 88
indent-width = 4

[tool.coverage.run]
source = ["backend"]
omit = ["backend/scripts/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__",
    "if TYPE_CHECKING",
]

[tool.ruff.lint]
# Enable Pyflakes (`F`) and pycodestyle (`E`, `W`) codes by default.
select = ["E4", "E7", "E9", "F"]
ignore = []

# Allow fix for all enabled rules (when `--fix` is provided).
fixable = ["ALL"]
unfixable = []
