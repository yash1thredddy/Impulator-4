[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = -v --tb=short -m "not network"
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests requiring database
    e2e: marks end-to-end tests
    azure: marks tests requiring Azure credentials
    benchmark: marks performance benchmark tests
    network: marks tests requiring live external network/API access
filterwarnings =
    ignore::ResourceWarning:sqlalchemy
