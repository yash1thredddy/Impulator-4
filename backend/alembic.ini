[alembic]
# path to migration environment (relative to this file)
script_location = alembic

# template for revision filenames (hash + slug)
file_template = %%(rev)s_%%(slug)s

# truncate slug to reasonable length
truncate_slug_length = 60

# sqlalchemy.url left empty -- overridden by env.py from backend.config.settings
sqlalchemy.url =

# timezone for revision timestamps
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys =

[formatters]
keys =

[logger_root]
level = WARN
handlers =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic
