name: Sync to Hugging Face Space

on:
  workflow_run:
    workflows:
      - CI - Tests
    types:
      - completed
  workflow_dispatch:  # Allows manual triggering from GitHub Actions UI

jobs:
  sync:
    # Auto-sync only after CI tests succeed on master pushes.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # For workflow_run, sync exactly the commit that passed CI.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install huggingface_hub
        run: pip install "huggingface_hub>=0.23.0"

      - name: Upload to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - << 'EOF'
          import os
          from huggingface_hub import HfApi

          token = os.environ["HF_TOKEN"]
          api = HfApi(token=token)
          api.upload_folder(
              folder_path=".",
              repo_id="yash1th26/Impulator",
              repo_type="space",
              revision="main",
              create_pr=False,
              commit_message="Auto-sync after CI pass",
          )
          EOF
