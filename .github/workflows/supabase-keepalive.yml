name: Supabase Keep-Alive

on:
  schedule:
    # Every 3 days at 08:00 UTC -- prevents Supabase free tier 7-day inactivity pause
    - cron: '0 8 */3 * *'
  workflow_dispatch:
    # Allow manual triggering for testing

# issues:write only, so a failed run can open/update the alert issue below.
# The keep-alive was red for six weeks (2026-09-25..11-04) with no one notified.
permissions:
  issues: write

# Queue overlapping runs (schedule + manual dispatch) so the alert step's
# list-then-create can never race into duplicate issues.
concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    name: Query Supabase Database
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Run read-only queries against real tables
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set"
            exit 1
          fi
          # A bare `SELECT 1` did not stop the project from being paused
          # (it was paused 2026-09-23..25 despite a successful ping on 09-22),
          # so touch real data. Everything runs in a READ ONLY transaction.
          # Bound the call well inside the 5-min job timeout: a hang must end as a
          # normal step failure (so the failure() alert runs), not a job cancel.
          PGCONNECT_TIMEOUT=20 timeout 180 psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 --pset=pager=off <<'SQL' || { echo "::error::Keep-alive queries FAILED"; exit 1; }
          BEGIN READ ONLY;
          SET LOCAL statement_timeout = '30s';

          -- Row counts per table
          SELECT 'jobs' AS tbl, count(*) FROM jobs
          UNION ALL SELECT 'compounds', count(*) FROM compounds
          UNION ALL SELECT 'collections', count(*) FROM collections
          UNION ALL SELECT 'deleted_compounds', count(*) FROM deleted_compounds
          UNION ALL SELECT 'audit_events', count(*) FROM audit_events;

          -- Job mix and recency
          SELECT job_type, status, count(*) AS n, max(created_at) AS latest
          FROM jobs GROUP BY job_type, status ORDER BY job_type, status;

          -- IMP score distribution
          SELECT count(imp_score) AS scored,
                 round(avg(imp_score)::numeric, 4) AS mean,
                 round((percentile_cont(0.5) WITHIN GROUP (ORDER BY imp_score))::numeric, 4) AS median,
                 round(max(imp_score)::numeric, 4) AS max
          FROM compounds;

          -- Structural siblings (same InChIKey structure key) — top 5
          SELECT inchikey_structure_key, count(*) AS versions
          FROM compounds WHERE inchikey_structure_key IS NOT NULL
          GROUP BY inchikey_structure_key HAVING count(*) > 1
          ORDER BY versions DESC LIMIT 5;

          -- Recent audit activity by type (last 30 days)
          SELECT event_type, count(*) AS n
          FROM audit_events WHERE created_at > now() - interval '30 days'
          GROUP BY event_type ORDER BY n DESC;

          COMMIT;
          SQL
          echo "::notice::Keep-alive OK - real queries ran against the database"

      - name: Open or update the alert issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Supabase keep-alive is failing"
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number,title --jq "[.[] | select(.title == \"$title\")][0].number // empty")
          if [ -n "$n" ]; then
            gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "Failed again: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "The scheduled Supabase keep-alive failed: $RUN_URL

          If the log shows \`tenant/user ... not found\`, the project is paused: restore it in the Supabase dashboard. This issue closes automatically on the next successful run."
          fi

      - name: Close the alert issue once the keep-alive recovers
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Supabase keep-alive is failing"
          for n in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number,title --jq ".[] | select(.title == \"$title\") | .number"); do
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" --comment "Recovered: $RUN_URL"
          done
